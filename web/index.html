<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>stemtool</title>
<style>
  /* Jim Nightshade (Brian J. Bonislawsky / Astigmatic), SIL OFL 1.1. Gotica
     escrita a mano: trazo fino, puas, muy vertical.

     Se reserva para los dos titulos y en caja mixta. Una gotica en
     MAYUSCULAS no se lee: las versales de estas fuentes son capitulares,
     pensadas para ir una sola al principio de la palabra. El resto de la
     interfaz va en la sans del sistema. */
  @font-face {
    font-family: "Jim Nightshade";
    src: url("fonts/JimNightshade-Regular.ttf") format("truetype");
    font-display: swap;
  }

  /* Dos tonos y nada mas. Sin color, el acento tiene que ser otra cosa: aqui
     es la INVERSION. Lo activo o accionable se rellena de tinta y escribe en
     papel; lo demas es tinta sobre papel con una linea de 1px. Por eso no hay
     ni un --accent en todo el archivo. */
  :root {
    --paper: #fff;
    --wash: #f2f2f2;      /* plano hundido: barras vacias, teclas, relieve */
    --ink: #000;
    --ink2: #767676;      /* secundario; 4.5:1 sobre papel, el minimo legible */
    --line: #d6d6d6;

    --title: "Jim Nightshade", Georgia, serif;
    --sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper: #000; --wash: #141414; --ink: #fff; --ink2: #9a9a9a;
      --line: #2e2e2e;
      color-scheme: dark;
    }
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; padding: 0 0 40px; background: var(--paper); color: var(--ink);
    font: 15px/1.6 var(--sans);
  }

  /* Dos columnas: a la izquierda lo que se usa para empezar un trabajo, a la
     derecha lo que produce. Los controles no se van con el scroll, asi que
     subir la segunda cancion no obliga a volver arriba, y el alto que antes
     gastaba la cabecera ahora lo aprovecha la lista. */
  main {
    max-width: 1240px; margin: 0 auto; padding: 0 24px;
    display: grid; grid-template-columns: 330px minmax(0, 1fr); gap: 36px;
    align-items: start;
  }
  .panel { position: sticky; top: 24px; }

  :focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  ::selection { background: var(--ink); color: var(--paper); }

  /* --- cabecera ------------------------------------------------------------ */

  header { padding: 28px 0 0; }
  .mark {
    font-family: var(--title); font-size: 38px; line-height: 1;
    margin: 0; font-weight: 400; letter-spacing: .01em;
  }
  .rule { height: 1px; background: var(--ink); margin: 16px 0 12px; }
  .lede { color: var(--ink2); margin: 0 0 20px; font-size: 13.5px; line-height: 1.5; }

  /* --- zona de soltar ------------------------------------------------------ */

  /* Borde discontinuo: dice "sueltalo aqui" sin un solo adorno, y deja la
     linea continua libre para marcar el momento en que el archivo entra. */
  #drop {
    background: var(--paper); border: 1px dashed var(--line);
    padding: 30px 18px; text-align: center; cursor: pointer;
    transition: background .12s linear, border-color .12s linear;
  }
  #drop:hover { border-color: var(--ink2); }
  #drop.over { border: 1px solid var(--ink); background: var(--wash); }
  #drop .big {
    font-family: var(--title); font-size: 24px; display: block; line-height: 1.2;
  }
  #drop .meta { display: block; color: var(--ink2); font-size: 12px;
                margin-top: 8px; line-height: 1.5; }
  /* En bloque: en la columna estrecha la lista de formatos parte en dos
     lineas y el boton se subia a hacerle compania a la ultima. */
  .browse {
    display: block; margin: 16px auto 0;
    font: 600 12.5px/1 var(--sans); text-transform: uppercase;
    letter-spacing: .08em; background: var(--ink); color: var(--paper);
    border: 1px solid var(--ink); padding: 11px 20px; cursor: pointer;
  }
  .browse:hover, #drop:hover .browse {
    background: var(--paper); color: var(--ink);
  }

  /* --- preajustes ---------------------------------------------------------- */

  /* En columna, no lado a lado: en 330px de ancho "Máxima calidad · RoFormer
     + Demucs" parte en tres lineas y el boton queda mas alto que ancho. */
  .presets { display: flex; flex-direction: column; margin: 16px 0 10px;
             border: 1px solid var(--line); }
  .presets label {
    padding: 10px 13px; cursor: pointer;
    text-transform: uppercase; letter-spacing: .09em; font-size: 12.5px;
    font-weight: 600; color: var(--ink2);
    transition: background .12s linear, color .12s linear;
  }
  .presets label + label { border-top: 1px solid var(--line); }
  .presets input { position: absolute; opacity: 0; pointer-events: none; }
  .presets label:has(input:checked) { background: var(--ink); color: var(--paper); }
  .presets label:has(input:focus-visible) { outline: 2px solid var(--ink); outline-offset: 2px; }
  .presets small {
    display: block; font-size: 11px; font-weight: 400; letter-spacing: 0;
    text-transform: none; opacity: .75; margin-top: 3px;
  }
  .hint { color: var(--ink2); font-size: 12px; margin: 0; line-height: 2; }
  .hint kbd {
    font: 600 11px/1 var(--sans); border: 1px solid var(--line);
    padding: 3px 6px; color: var(--ink); background: var(--wash);
  }

  /* --- tarjetas ------------------------------------------------------------ */

  /* El filo izquierdo lleva el estado, por grosor de tinta y no por color:
     gris claro en reposo, medio mientras trabaja, negro entero si fallo. */
  .card {
    border: 1px solid var(--line); border-left: 3px solid var(--line);
    background: var(--paper); padding: 15px 17px; margin-bottom: 12px;
  }
  .card.live { border-left-color: var(--ink2); }
  .card.bad { border-left-color: var(--ink); }
  .top { display: flex; align-items: center; gap: 12px; }
  .name { font-weight: 600; flex: 1; min-width: 0; overflow: hidden;
          text-overflow: ellipsis; white-space: nowrap; }
  .tag {
    text-transform: uppercase; letter-spacing: .1em; font-size: 10px;
    font-weight: 600; border: 1px solid var(--line); padding: 4px 8px;
    color: var(--ink2); white-space: nowrap;
  }
  .x { background: none; border: 0; color: var(--ink2); cursor: pointer;
       font-size: 15px; line-height: 1; padding: 4px 6px; }
  .x:hover { color: var(--ink); }

  /* Lectura de datos: lo que el usuario vino a saber, en grande */
  .facts { display: flex; flex-wrap: wrap; gap: 10px 26px; margin: 13px 0 0; }
  .facts > div { display: flex; flex-direction: column-reverse; }
  .facts .k {
    text-transform: uppercase; letter-spacing: .12em; font-size: 10px;
    font-weight: 600; color: var(--ink2); margin-top: 2px;
  }
  .facts .v {
    font-size: 22px; font-weight: 600; line-height: 1.1;
    font-variant-numeric: tabular-nums; letter-spacing: -0.01em;
  }
  .facts .v.soft { color: var(--ink2); font-weight: 500; }
  /* La duda se marca en cursiva, no en ambar: sin color, la forma de la letra
     es lo unico que queda para decir "esto no te lo creas del todo". */
  .warn { color: var(--ink2); font-size: 11px; font-style: italic;
          font-weight: 400; letter-spacing: 0; margin-left: 7px;
          white-space: nowrap; }

  .bar { height: 6px; background: var(--wash); margin: 14px 0 7px; overflow: hidden; }
  .bar i {
    display: block; height: 100%; width: 0; background: var(--ink);
    transition: width .35s linear;
    /* Segmentado: se ve avanzar aunque el porcentaje se mueva despacio */
    -webkit-mask-image: repeating-linear-gradient(90deg, #000 0 7px, transparent 7px 9px);
    mask-image: repeating-linear-gradient(90deg, #000 0 7px, transparent 7px 9px);
  }
  .status {
    text-transform: uppercase; letter-spacing: .09em; font-size: 11.5px;
    font-weight: 600; color: var(--ink2);
  }
  /* El error se invierte. Es la unica etiqueta de toda la interfaz que lo
     hace sin que la toques, y por eso se ve de lejos. */
  .status.err {
    background: var(--ink); color: var(--paper); padding: 3px 8px;
    display: inline-block;
  }

  /* --- mezclador ------------------------------------------------------------ */

  .stems { margin: 14px 0 0; display: none; border-top: 1px solid var(--line); }
  .stems.on { display: block; }
  .stem {
    display: flex; align-items: center; gap: 12px; padding: 7px 0;
    border-bottom: 1px solid var(--line);
  }
  .stem:last-child { border-bottom: 0; }
  .stem input[type=checkbox] { accent-color: var(--ink); width: 15px; height: 15px; margin: 0; }
  .stem .label {
    text-transform: uppercase; letter-spacing: .1em; font-size: 12.5px;
    font-weight: 600; width: 92px; flex: none;
  }
  .stem.off .label { opacity: .4; }
  /* Medidor: se mide antes de la ganancia, asi un stem silenciado sigue
     delatando que tiene senal (sirve para oir fugas entre pistas). */
  .meter { flex: 1; height: 10px; background: var(--wash); min-width: 40px; }
  .meter i { display: block; height: 100%; width: 100%; background: var(--ink);
             transform: scaleX(0); transform-origin: left; }
  .stem.off .meter i { background: var(--ink2); }
  .stem button {
    font: 700 12px/1 var(--sans); background: none; border: 1px solid var(--line);
    color: var(--ink2); cursor: pointer; width: 32px; padding: 7px 0;
  }
  .stem button:hover { border-color: var(--ink); color: var(--ink); }
  .stem button.on { background: var(--ink); border-color: var(--ink); color: var(--paper); }

  /* --- transporte ----------------------------------------------------------- */

  .actions { display: flex; gap: 10px; align-items: center; margin-top: 13px;
             padding-top: 13px; border-top: 1px solid var(--line); flex-wrap: wrap; }
  .play {
    font-size: 13px; background: var(--ink); color: var(--paper);
    border: 1px solid var(--ink); cursor: pointer; width: 52px; padding: 10px 0;
    line-height: 1;
  }
  .play:hover { background: var(--paper); color: var(--ink); }

  /* Barra de posicion a mano: el control nativo es una pildora gorda que no
     pega con nada de aqui. El relleno lo pinta --p, que el reproductor
     actualiza en cada fotograma; el pulgar es una plomada de 4px. */
  .seek {
    flex: 1; min-width: 140px; height: 20px; -webkit-appearance: none;
    appearance: none; background: none; cursor: pointer;
  }
  .seek::-webkit-slider-runnable-track {
    height: 6px; background: linear-gradient(90deg, var(--ink) var(--p, 0%), var(--line) 0);
  }
  .seek::-webkit-slider-thumb {
    -webkit-appearance: none; width: 4px; height: 20px; margin-top: -7px;
    background: var(--ink); border: 0;
  }
  .seek::-moz-range-track { height: 6px; background: var(--line); }
  .seek::-moz-range-progress { height: 6px; background: var(--ink); }
  .seek::-moz-range-thumb { width: 4px; height: 20px; background: var(--ink);
                            border: 0; border-radius: 0; }

  .time { font-size: 12.5px; color: var(--ink2); white-space: nowrap;
          font-variant-numeric: tabular-nums; }
  .row2 { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; width: 100%; }
  .click { display: flex; align-items: center; gap: 7px; font-size: 13px;
           color: var(--ink2); cursor: pointer; white-space: nowrap; }
  .click input { accent-color: var(--ink); }
  select {
    font: 500 13px/1 var(--sans); background: var(--paper); color: var(--ink);
    border: 1px solid var(--line); padding: 10px 8px; cursor: pointer;
  }
  .dl {
    margin-left: auto; font: 700 13px/1 var(--sans); text-transform: uppercase;
    letter-spacing: .08em; background: var(--ink); color: var(--paper);
    border: 1px solid var(--ink); padding: 13px 24px; cursor: pointer;
  }
  .dl:hover { background: var(--paper); color: var(--ink); }
  .dl:disabled { background: var(--paper); color: var(--ink2);
                 border-color: var(--line); cursor: default; }

  .empty {
    color: var(--ink2); text-transform: uppercase; letter-spacing: .12em;
    font-size: 12px; font-weight: 600; text-align: center; padding: 40px 0;
  }
  .empty.lost { color: var(--ink); }

  /* Una sola columna en cuanto la derecha se queda sin sitio: dos columnas
     estrechas obligan a mas scroll que una ancha, que es lo contrario de
     para lo que estan. */
  @media (max-width: 980px) {
    main { grid-template-columns: minmax(0, 1fr); gap: 0; padding: 0 20px; }
    .panel { position: static; margin-bottom: 26px; }
    .presets { flex-direction: row; }
    .presets label { flex: 1; text-align: center; }
    .presets label + label { border-top: 0; border-left: 1px solid var(--line); }
  }

  @media (max-width: 560px) {
    .mark { font-size: 30px; }
    #drop .big { font-size: 21px; }
    .facts { gap: 12px 22px; }
    .facts .v { font-size: 20px; }
    .stem .label { width: 78px; }
    .dl { margin-left: 0; width: 100%; }
  }
</style>
</head>
<body>
<main>
 <aside class="panel">
  <header>
    <h1 class="mark">Stemtool</h1>
    <div class="rule"></div>
    <p class="lede">Separador de stems local. Nada sale de este ordenador:
      el audio se queda aquí y la GPU hace el trabajo.</p>
  </header>

  <div id="drop" role="button" tabindex="0" aria-label="Soltar o elegir archivos de audio">
    <span class="big">Suelta un audio</span>
    <span class="meta">mp3 · wav · flac · m4a · aac · ogg · opus · aiff · wma &nbsp;—&nbsp; hasta 600 MB</span>
    <button class="browse" type="button" id="browse">Elegir archivo</button>
    <input type="file" id="file" multiple accept="audio/*" hidden>
  </div>

  <div class="presets" role="radiogroup" aria-label="Calidad">
    <label><input type="radio" name="preset" value="fast" checked>
      <span>Rápido<small>htdemucs_ft · un paso</small></span></label>
    <label><input type="radio" name="preset" value="max">
      <span>Máxima calidad<small>RoFormer + Demucs · más lento</small></span></label>
  </div>
  <p class="hint"><kbd>espacio</kbd> reproduce o pausa &nbsp;·&nbsp;
    <kbd>M</kbd> silencia &nbsp;·&nbsp; <kbd>S</kbd> deja un stem solo</p>
 </aside>

 <section aria-label="Trabajos">
  <div id="list"></div>
  <p class="empty" id="empty">Nada todavía</p>
 </section>
</main>
<script type="module" src="dist/web/app.js"></script>
</body>
</html>
